name: Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:

  # Unit tests (phpunit) and code style (phpcs)
  laravel-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: 12.*
            testbench: 10.*
          - php: '8.3'
            laravel: 12.*
            testbench: 10.*
          - php: '8.4'
            laravel: 12.*
            testbench: 10.*
          - php: '8.5'
            laravel: 12.*
            testbench: 10.*
          - php: '8.3'
            laravel: 13.*
            testbench: 11.*
          - php: '8.4'
            laravel: 13.*
            testbench: 11.*
          - php: '8.5'
            laravel: 13.*
            testbench: 11.*
          # Oldest supported Scout and Solarium
          - php: '8.2'
            laravel: 12.*
            testbench: 10.*
            extra: '"laravel/scout:^10.0" "solarium/solarium:^6.3"'
            label: ' / Scout 10 / Solarium 6'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: cs2pr
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.label }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-
      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" ${{ matrix.extra }} --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: ./vendor/bin/phpunit --testsuite Unit --log-junit junit.xml
      - name: Annotate PHPUnit failures
        if: failure() && hashFiles('junit.xml') != ''
        run: |
          php -r '
            $xml = simplexml_load_file("junit.xml");
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
                $node = $case->failure ?: $case->error;
                $msg = str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr((string) $node, 0, 1500));
                echo "::error title=" . $case["name"] . "::" . $msg . PHP_EOL;
            }
          '
      - name: Execute codesniffer tests
        run: ./vendor/bin/phpcs --standard=./phpcs.xml --report-full --report-checkstyle=./phpcs.xml.report ./ || (cs2pr ./phpcs.xml.report && exit 1)

  coverage-report:
    runs-on: ubuntu-latest
    name: Coverage report
    env:
      SOLR_HOST: localhost
      SOLR_PORT: 8983
    steps:
      - uses: actions/checkout@v7
      - name: Start Solr
        env:
          SOLR_VERSION: '9'
        run: |
          docker compose up -d solr
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8983/solr/admin/info/system?wt=json" > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, curl
          coverage: pcov
      - name: Install Composer dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Coverage, unit tests only
        run: ./vendor/bin/phpunit --testsuite Unit --coverage-text=unit.txt --colors=never
      - name: Coverage, unit and integration tests
        run: ./vendor/bin/phpunit --coverage-text=all.txt --colors=never
      - name: Report
        if: always()
        run: |
          for f in unit all; do
            [ -f $f.txt ] && awk 'BEGIN{ORS="%0A"} {print}' $f.txt | sed "s/^/::notice title=coverage-$f::/"
          done

  # Static analysis (PHPStan with Larastan)
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl
          coverage: none
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-phpstan-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-composer-
      - name: Install Composer dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github --no-progress
      - name: All PHPStan errors in one annotation
        if: failure()
        run: ./vendor/bin/phpstan analyse --error-format=raw --no-progress 2>&1 | head -c 20000 | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=phpstan-all::/'

  # Integration tests against a real Solr instance
  solr-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solr: '8.11'
            php: '8.4'
            laravel: 13.*
            testbench: 11.*
          - solr: '9'
            php: '8.4'
            laravel: 13.*
            testbench: 11.*
          # Solr 10 starts in SolrCloud mode, so this job covers the Collections API path
          - solr: '10'
            php: '8.4'
            laravel: 13.*
            testbench: 11.*
            cloud: 'true'
            label: ' / SolrCloud'
          # Oldest supported PHP, Laravel, Scout and Solarium
          - solr: '9'
            php: '8.2'
            laravel: 12.*
            testbench: 10.*
            extra: '"laravel/scout:^10.0" "solarium/solarium:^6.3"'
            label: ' / Scout 10 / Solarium 6'
    name: Solr ${{ matrix.solr }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.label }}
    env:
      SOLR_HOST: localhost
      SOLR_PORT: 8983
    steps:
      - uses: actions/checkout@v7
      - name: Start Solr
        env:
          SOLR_VERSION: ${{ matrix.solr }}
        run: |
          docker compose up -d solr
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8983/solr/admin/info/system?wt=json" > /dev/null && exit 0
            sleep 2
          done
          docker compose logs solr
          exit 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, curl
          coverage: none
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.label }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-
      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" ${{ matrix.extra }} --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Execute integration tests via PHPUnit
        env:
          SOLR_CLOUD: ${{ matrix.cloud || 'false' }}
        run: ./vendor/bin/phpunit --testsuite Integration --log-junit junit.xml
      - name: Annotate PHPUnit failures
        if: failure() && hashFiles('junit.xml') != ''
        run: |
          php -r '
            $xml = simplexml_load_file("junit.xml");
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
                $node = $case->failure ?: $case->error;
                $msg = str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr((string) $node, 0, 1500));
                echo "::error title=" . $case["name"] . "::" . $msg . PHP_EOL;
            }
          '
      - name: Solr logs on failure
        if: failure()
        run: docker compose logs --no-log-prefix solr 2>&1 | grep -E "ERROR|Exception" | tail -20 | sed 's/^/::warning title=solr::/'
