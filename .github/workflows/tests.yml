name: Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:

  # Unit tests (phpunit) and code style (phpcs)
  laravel-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            laravel: 9.*
            testbench: 7.*
          - php: '8.1'
            laravel: 9.*
            testbench: 7.*
          - php: '8.2'
            laravel: 9.*
            testbench: 7.*
          - php: '8.3'
            laravel: 9.*
            testbench: 7.*
          - php: '8.1'
            laravel: 10.*
            testbench: 8.*
          - php: '8.2'
            laravel: 10.*
            testbench: 8.*
          - php: '8.3'
            laravel: 10.*
            testbench: 8.*
          - php: '8.2'
            laravel: 11.*
            testbench: 9.*
          - php: '8.3'
            laravel: 11.*
            testbench: 9.*
          - php: '8.4'
            laravel: 11.*
            testbench: 9.*
          - php: '8.2'
            laravel: 12.*
            testbench: 10.*
          - php: '8.3'
            laravel: 12.*
            testbench: 10.*
          - php: '8.4'
            laravel: 12.*
            testbench: 10.*
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: cs2pr
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-
      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: ./vendor/bin/phpunit --testsuite Unit --log-junit junit.xml
      - name: Annotate PHPUnit failures
        if: failure() && hashFiles('junit.xml') != ''
        run: |
          php -r '
            $xml = simplexml_load_file("junit.xml");
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
                $node = $case->failure ?: $case->error;
                $msg = str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr((string) $node, 0, 1500));
                echo "::error title=" . $case["name"] . "::" . $msg . PHP_EOL;
            }
          '
      - name: Execute codesniffer tests
        run: ./vendor/bin/phpcs --standard=./phpcs.xml --report-full --report-checkstyle=./phpcs.xml.report ./ || (cs2pr ./phpcs.xml.report && exit 1)

  # Integration tests against a real Solr instance
  solr-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solr: '8.11'
            php: '8.4'
            laravel: 12.*
            testbench: 10.*
          - solr: '9'
            php: '8.4'
            laravel: 12.*
            testbench: 10.*
          - solr: '9'
            php: '8.1'
            laravel: 10.*
            testbench: 8.*
    name: Solr ${{ matrix.solr }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    env:
      SOLR_HOST: localhost
      SOLR_PORT: 8983
    steps:
      - uses: actions/checkout@v7
      - name: Start Solr
        run: |
          docker run -d --name solr -p 8983:8983 solr:${{ matrix.solr }}
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8983/solr/admin/info/system?wt=json" > /dev/null; then
              # The official image keeps config sets outside the Solr home; copy them
              # in so cores can be created from _default through the API.
              docker exec solr cp -r /opt/solr/server/solr/configsets /var/solr/data/
              exit 0
            fi
            sleep 2
          done
          docker logs solr
          exit 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, curl
          coverage: none
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-
      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Execute integration tests via PHPUnit
        run: ./vendor/bin/phpunit --testsuite Integration --log-junit junit.xml
      - name: Annotate PHPUnit failures
        if: failure() && hashFiles('junit.xml') != ''
        run: |
          php -r '
            $xml = simplexml_load_file("junit.xml");
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
                $node = $case->failure ?: $case->error;
                $msg = str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr((string) $node, 0, 1500));
                echo "::error title=" . $case["name"] . "::" . $msg . PHP_EOL;
            }
          '
      - name: Solr logs on failure
        if: failure()
        run: docker logs solr 2>&1 | grep -E "ERROR|Exception" | tail -20 | sed 's/^/::warning title=solr::/'
